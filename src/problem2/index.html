<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fancy Form</title>

    <!-- You may add more stuff here -->
    <link href="style.css" rel="stylesheet" />
  </head>

  <body>
    <!-- You may reorganise the whole HTML, as long as your form achieves the same effect. -->
    <form onsubmit="return !1">
      <h5>Swap Curency</h5>
      <div class="form-group">
        <div>
          <label for="input-amount">Amount to send</label>
          <div class="input-group">
            <input
              id="input-amount"
              class="amount"
              type="number"
              min="0"
              step="0.00000000000000001"
              onkeydown="return event.keyCode !== 189"
            />

            <select id="input-currency" class="currency">
              <option value="aud" selected>AUD</option>
              <option value="cad">CAD</option>
              <option value="chf">CHF</option>
              <option value="eur">EUR</option>
              <option value="gbp">GBP</option>
              <option value="jpy">JPY</option>
              <option value="usd">USD</option>
            </select>
          </div>
        </div>
        <div class="arrow">
          <img src="assets/icon/arrow.svg" alt="Arrow" />
        </div>
        <div>
          <label for="output-amount">Amount to receive</label>
          <!-- <input id="output-amount" /> -->
          <div class="input-group">
            <input disabled id="output-amount" class="amount" type="number" />
            <select id="output-currency" class="currency">
              <option value="aud">AUD</option>
              <option value="cad" selected>CAD</option>
              <option value="chf">CHF</option>
              <option value="eur">EUR</option>
              <option value="gbp">GBP</option>
              <option value="jpy">JPY</option>
              <option value="usd">USD</option>
            </select>
          </div>
        </div>
      </div>

      <div>
        <h3>
          Exchange rates:
          <div id="result"></div>
        </h3>
      </div>

      <button
        onclick="getCurrencyRate(document.getElementById('input-currency').value, document.getElementById('output-currency').value, document.getElementById('input-amount').value)"
        class="btn"
      >
        CONFIRM SWAP
      </button>
    </form>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
