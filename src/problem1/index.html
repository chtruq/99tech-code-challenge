<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Problem 1</h1>
    <p>
      Write a function that receive "n" and return the sum of the numbers from 1
      to n. (n>=1)
    </p>
    <div>
      <input type="number" id="input" min="1" />
      <button onclick="sum_to_n_total(document.getElementById('input'))">
        Submit
      </button>
    </div>
    <div>
      <p id="output"><span id="output-error" style="color: red"> </span></p>
      <h2>Using a loop</h2>
      <p id="output">Output 1: <span id="output-value1"> </span></p>
      <h2>Using recursion</h2>
      <p id="output">Output 2: <span id="output-value2"> </span></p>
      <h2>
        Arithmetic series formula
        <h2 style="color: cadetblue">(n * (n + 1)) / 2</h2>
      </h2>
      <p id="output">Output 3: <span id="output-value3"> </span></p>
    </div>
  </body>
  <script src="script.js"></script>
</html>
